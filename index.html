<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Blog & Apps</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --text: #222222;
    --muted: #666666;
    --accent: #4f6df5;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 48px 20px 24px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 2rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  section {
    margin-top: 40px;
  }
  section h2 {
    font-size: 1.25rem;
    border-bottom: 2px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 20px;
  }
  .empty-state {
    color: var(--muted);
    font-size: 0.95rem;
    padding: 24px 0;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .app-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .app-card:hover,
  .app-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  }
  .app-card .preview {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #faf8ef;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .app-card .preview iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 400%;
    height: 400%;
    transform: scale(0.25);
    transform-origin: top left;
    border: none;
    pointer-events: none;
  }
  .app-card .card-body {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .app-card .card-body h3 {
    margin: 0;
    font-size: 1.05rem;
  }
  .app-card .card-body p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
    flex: 1;
  }
  .app-card .play-label {
    margin-top: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }
  footer {
    text-align: center;
    padding: 24px 20px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <header>
    <h1>My Blog & Apps</h1>
    <p>마크다운 기반 블로그 + 미니 웹앱 포트폴리오</p>
  </header>

  <main>
    <section id="posts">
      <h2>블로그 글</h2>
      <div class="empty-state">아직 작성된 글이 없습니다.</div>
    </section>

    <section id="apps">
      <h2>미니 웹앱</h2>
      <div class="app-grid">
        <a class="app-card" href="apps/2048/index.html">
          <div class="preview">
            <iframe src="apps/2048/index.html" title="2048 게임 미리보기" tabindex="-1"></iframe>
          </div>
          <div class="card-body">
            <h3>2048</h3>
            <p>방향키(또는 스와이프)로 숫자 타일을 밀어서 합치는 퍼즐 게임. 점수판과 최고 점수 기록을 지원합니다.</p>
            <span class="play-label">플레이하기 →</span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026</p>
  </footer>
</body>
</html>
