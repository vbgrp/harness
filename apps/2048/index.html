<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-area">
        <h1>2048</h1>
        <p class="subtitle">타일을 합쳐 2048을 만들어보세요!</p>
      </div>
      <div class="scores">
        <div class="score-box" aria-live="polite">
          <span class="score-label">SCORE</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-box" aria-live="polite">
          <span class="score-label">BEST</span>
          <span id="best-score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <button id="restart-btn" class="btn" aria-label="새 게임 시작">New Game</button>
    </div>

    <div class="board-wrap">
      <div id="game-board" class="board">
        <div class="grid-bg" id="grid-bg" aria-hidden="true"></div>
        <div id="tile-container" class="tile-container"></div>

        <div id="game-message" class="game-message" hidden>
          <p id="game-message-text"></p>
          <div class="game-message-buttons">
            <button id="keep-going-btn" class="btn" aria-label="계속 플레이" hidden>계속하기</button>
            <button id="try-again-btn" class="btn" aria-label="다시 시작">다시 시작</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">방향키(↑↓←→)로 이동하세요. 모바일에서는 화면을 스와이프하세요.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
